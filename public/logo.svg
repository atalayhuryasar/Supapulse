<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ecf8e" />
      <stop offset="100%" stop-color="#249c66" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />
  
  <!-- Subtle Glow Layer -->
  <circle cx="64" cy="64" r="44" fill="#3ecf8e" opacity="0.08" />

  <!-- Heartbeat ECG Pulse Wave + Bolt -->
  <path
    d="M 22 64 L 40 64 L 48 46 L 58 84 L 70 34 L 80 74 L 88 64 L 106 64"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Pulse Dot -->
  <circle cx="70" cy="34" r="4" fill="#ffffff" />
</svg>
