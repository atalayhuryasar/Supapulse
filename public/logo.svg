<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background styling -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Emerald pulse gradient -->
    <linearGradient id="pulseGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ecf8e" />
      <stop offset="50%" stop-color="#5eedab" />
      <stop offset="100%" stop-color="#3ecf8e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Heartbeat scale animation on ambient circle */
      @keyframes heartbeat {
        0% { transform: scale(1); opacity: 0.15; }
        15% { transform: scale(1.18); opacity: 0.35; }
        30% { transform: scale(1); opacity: 0.18; }
        45% { transform: scale(1.1); opacity: 0.28; }
        60% { transform: scale(1); opacity: 0.15; }
        100% { transform: scale(1); opacity: 0.15; }
      }

      /* ECG drawing pulse animation */
      @keyframes pulseRun {
        0% {
          stroke-dashoffset: 320;
          opacity: 0.4;
        }
        15% {
          opacity: 1;
        }
        50% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        70% {
          stroke-dashoffset: -320;
          opacity: 0.4;
        }
        100% {
          stroke-dashoffset: -320;
          opacity: 0.4;
        }
      }

      /* Blinking LED ping dot */
      @keyframes dotBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        20%, 50% { opacity: 1; transform: scale(1.3); }
        70% { opacity: 0.3; transform: scale(0.9); }
      }

      .ambient-glow {
        transform-origin: center;
        animation: heartbeat 2.2s ease-in-out infinite;
      }

      .pulse-trace {
        stroke-dasharray: 120 200;
        animation: pulseRun 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .pulse-bg-trace {
        opacity: 0.2;
      }

      .ping-dot {
        transform-origin: 64px 32px;
        animation: dotBlink 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box with Supabase dark theme border -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Animated Ambient Emerald Heartbeat Aura -->
  <circle cx="64" cy="64" r="42" fill="#3ecf8e" class="ambient-glow" filter="url(#neonGlow)" />

  <!-- Dim static pulse path behind -->
  <path
    d="M 22 64 L 38 64 L 46 48 L 56 82 L 66 32 L 76 76 L 84 64 L 106 64"
    fill="none"
    stroke="#3ecf8e"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="pulse-bg-trace"
  />

  <!-- High-voltage moving neon pulse trace -->
  <path
    d="M 22 64 L 38 64 L 46 48 L 56 82 L 66 32 L 76 76 L 84 64 L 106 64"
    fill="none"
    stroke="url(#pulseGreen)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="pulse-trace"
    filter="url(#neonGlow)"
  />

  <!-- Active Ping Peak Indicator -->
  <circle cx="66" cy="32" r="3.5" fill="#ffffff" class="ping-dot" filter="url(#neonGlow)" />
</svg>
